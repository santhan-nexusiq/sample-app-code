name: CI - Build Image and Update Helm Repo

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout application code
      - name: Checkout application code
        uses: actions/checkout@v4

      # 2️⃣ Generate image tag from commit SHA
      - name: Set image tag
        id: vars
        run: |
          echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/sample-app:${{ steps.vars.outputs.TAG }} .

      # 5️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sample-app:${{ steps.vars.outputs.TAG }}

      # 6️⃣ Clone Helm repo and update image tag
      - name: Update image tag in Helm repo
        run: |
          git clone https://x-access-token:${{ secrets.HELM_REPO_PAT }}@github.com/santhan-nexusiq/sample-app-helm.git
          cd sample-app-helm

          sed -i "s|tag:.*|tag: \"${{ steps.vars.outputs.TAG }}\"|" charts/sample-app/values.yaml

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add charts/sample-app/values.yaml
          git commit -m "ci: update image tag to ${{ steps.vars.outputs.TAG }}"
          git push

